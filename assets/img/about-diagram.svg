<svg width="720" height="460" viewBox="0 0 720 460" xmlns="http://www.w3.org/2000/svg" fill="none">
  <defs>
    <linearGradient id="card" x1="0" y1="0" x2="720" y2="460" gradientUnits="userSpaceOnUse">
      <stop offset="0" stop-color="#FFFFFF"/>
      <stop offset="0.52" stop-color="#F7FFF8"/>
      <stop offset="1" stop-color="#EEF9FF"/>
    </linearGradient>
    <linearGradient id="blueGreen" x1="168" y1="96" x2="552" y2="380" gradientUnits="userSpaceOnUse">
      <stop offset="0" stop-color="#0071CE"/>
      <stop offset="1" stop-color="#16B95D"/>
    </linearGradient>
    <filter id="softShadow" x="-20%" y="-20%" width="140%" height="140%" color-interpolation-filters="sRGB">
      <feDropShadow dx="0" dy="16" stdDeviation="18" flood-color="#0B1F33" flood-opacity="0.10"/>
    </filter>
    <filter id="nodeShadow" x="-40%" y="-40%" width="180%" height="180%" color-interpolation-filters="sRGB">
      <feDropShadow dx="0" dy="10" stdDeviation="12" flood-color="#0071CE" flood-opacity="0.10"/>
    </filter>
  </defs>

  <rect x="8" y="8" width="704" height="444" rx="30" fill="url(#card)" filter="url(#softShadow)"/>
  <rect x="9" y="9" width="702" height="442" rx="29" stroke="#BFE1F2" stroke-width="1.5" opacity="0.9"/>
  <text x="360" y="66" text-anchor="middle" fill="#0B1F33" font-family="'Yu Mincho','Hiragino Mincho ProN','Noto Serif JP',serif" font-size="28" font-weight="700" letter-spacing=".08em">多様な視点で、未来を構想する</text>

  <g opacity="0.18" stroke="url(#blueGreen)" stroke-width="1.4">
    <path d="M120 106 C210 86 252 126 332 98"/>
    <path d="M392 104 C484 72 550 94 616 142"/>
    <path d="M94 354 C186 334 248 384 326 350"/>
    <path d="M408 352 C504 326 562 360 626 322"/>
  </g>

  <circle cx="360" cy="252" r="120" stroke="#16B95D" stroke-width="2.2" stroke-dasharray="5 12" stroke-linecap="round" opacity="0.72"/>
  <g stroke="#16B95D" stroke-width="1.8" opacity="0.58">
    <path d="M284 187 L325 220"/>
    <path d="M436 187 L395 220"/>
    <path d="M284 317 L325 284"/>
    <path d="M436 317 L395 284"/>
  </g>

  <g filter="url(#nodeShadow)">
    <circle cx="360" cy="252" r="72" fill="#FFFFFF" stroke="#16B95D" stroke-width="2.5"/>
    <text x="360" y="244" text-anchor="middle" fill="#0B1F33" font-family="'Noto Sans JP','Hiragino Kaku Gothic ProN','Yu Gothic',sans-serif" font-size="24" font-weight="800">ナゴヤの</text>
    <text x="360" y="282" text-anchor="middle" fill="#0B1F33" font-family="'Noto Sans JP','Hiragino Kaku Gothic ProN','Yu Gothic',sans-serif" font-size="34" font-weight="900">未来</text>
  </g>

  <g font-family="'Noto Sans JP','Hiragino Kaku Gothic ProN','Yu Gothic',sans-serif" font-size="18" font-weight="800" letter-spacing=".02em">
    <!-- Industry / Economy -->
    <g filter="url(#nodeShadow)">
      <circle cx="210" cy="150" r="58" fill="#FFFFFF" stroke="#0071CE" stroke-width="2.5"/>
      <path d="M180 171h62M191 171v-48h19v48M220 171v-65l30 10v55M196 139h6M226 132h7M226 151h7" stroke="#0071CE" stroke-width="5" stroke-linecap="round" stroke-linejoin="round"/>
    </g>
    <text x="210" y="236" text-anchor="middle" fill="#0071CE">産業・経済</text>

    <!-- Urban infrastructure -->
    <g filter="url(#nodeShadow)">
      <circle cx="510" cy="150" r="58" fill="#FFFFFF" stroke="#3E8F73" stroke-width="2.5"/>
      <path d="M488 176v-55h44v55M500 176v-78h20v78M492 139h7M521 139h7M492 156h7M521 156h7M498 98h24" stroke="#3E8F73" stroke-width="4.8" stroke-linecap="round" stroke-linejoin="round"/>
    </g>
    <text x="510" y="236" text-anchor="middle" fill="#3E8F73">まちづくり・都市基盤</text>

    <!-- Lifestyle / Environment -->
    <g filter="url(#nodeShadow)">
      <circle cx="210" cy="354" r="58" fill="#FFFFFF" stroke="#3E8F73" stroke-width="2.5"/>
      <path d="M174 370c22-54 60-54 82 0" stroke="#3E8F73" stroke-width="5" stroke-linecap="round"/>
      <path d="M193 349c4-18 34-22 45 1c-19 2-33 9-45-1Z" stroke="#3E8F73" stroke-width="4.5" stroke-linecap="round" stroke-linejoin="round"/>
      <path d="M235 346c13-30 38-25 48 0" stroke="#3E8F73" stroke-width="5" stroke-linecap="round" opacity="0.72"/>
    </g>
    <text x="210" y="430" text-anchor="middle" fill="#3E8F73">暮らし・環境</text>

    <!-- Culture / Education -->
    <g filter="url(#nodeShadow)">
      <circle cx="510" cy="354" r="58" fill="#FFFFFF" stroke="#16B95D" stroke-width="2.5"/>
      <path d="M474 330c27-13 45 3 72-11v72c-27 14-45-2-72 12v-73Z" stroke="#16B95D" stroke-width="5" stroke-linecap="round" stroke-linejoin="round"/>
      <path d="M510 328v70" stroke="#16B95D" stroke-width="4" stroke-linecap="round"/>
    </g>
    <text x="510" y="430" text-anchor="middle"><tspan fill="#0071CE">文化・</tspan><tspan fill="#16B95D">教育</tspan></text>
  </g>
</svg>
